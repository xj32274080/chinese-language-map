<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日新教师工具箱</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    
    <!-- XLSX 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        html {
            scroll-padding-top: 5rem;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f0f9ff;
            color: #1e3a8a;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden; /* 防止因为某些元素微小溢出导致的左右晃动 */
        }
        
        .title-font {
            font-family: 'ZCOOL QingKe HuangYou', 'Ma Shan Zheng', cursive;
        }

        /* --- 隐藏滚动条但保留滚动功能 (用于自适应导航栏) --- */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* --- Navigation Styles --- */
        .nav-button {
            transition: all 0.3s ease;
            border-bottom: 4px solid transparent;
        }
        .nav-button.active {
            border-bottom-color: #3b82f6;
            color: #2563eb;
            transform: translateY(-2px);
        }

        /* Hide pages by default */
        .page-content {
            display: none;
        }
        .page-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Shared Styles --- */
        .main-title { background: linear-gradient(135deg, #2c5282 0%, #3b82f6 60%, #60a5fa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- Existing Apps Styles (Rixin, Bubbles etc.) --- */
        #page-rixin .bubble, #page-bubbles .bubble, #page-score .bubble { transition: transform 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.32s ease, border-color 0.28s ease, filter 0.28s ease; background: radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0.72) 18%, rgba(234, 244, 255, 0.62) 36%, rgba(198, 223, 248, 0.28) 66%, rgba(255, 255, 255, 0.06) 100%); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.72); animation: rx-float-orb 9s ease-in-out infinite alternate; box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.92), inset -3px -4px 10px rgba(163, 191, 225, 0.26), 0 16px 30px rgba(74, 110, 160, 0.12), 0 0 28px rgba(219, 234, 254, 0.45); position: relative; overflow: hidden; }
        #page-rixin .bubble::before, #page-bubbles .bubble::before, #page-score .bubble::before { content: ''; position: absolute; inset: 8% 14% auto 18%; height: 28%; border-radius: 9999px; background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0)); filter: blur(1px); opacity: 0.92; pointer-events: none; }
        #page-rixin .bubble::after, #page-bubbles .bubble::after, #page-score .bubble::after { content: ''; position: absolute; inset: auto 14% 12% auto; width: 28%; height: 28%; border-radius: 9999px; background: radial-gradient(circle, rgba(255,255,255,0.55), rgba(255,255,255,0)); pointer-events: none; }
        #page-rixin .bubble:hover, #page-bubbles .bubble:hover, #page-score .bubble:hover { transform: translateY(-4px) scale(1.03); box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.96), inset -3px -4px 12px rgba(163, 191, 225, 0.28), 0 18px 34px rgba(59, 130, 246, 0.16), 0 0 32px rgba(186, 230, 253, 0.52); filter: saturate(1.04); }
        #page-bubbles .bubble.selected { background: radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.98) 0%, rgba(214, 240, 255, 0.92) 16%, rgba(121, 191, 249, 0.72) 42%, rgba(74, 146, 224, 0.42) 74%, rgba(59, 130, 246, 0.18) 100%); border-color: rgba(96, 165, 250, 0.9); box-shadow: inset 0 2px 8px rgba(255,255,255,0.92), inset -2px -3px 10px rgba(59, 130, 246, 0.22), 0 18px 34px rgba(59, 130, 246, 0.22), 0 0 34px rgba(125, 211, 252, 0.48); }
        .bubble-fill-effect { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(125, 211, 252, 0.18) 0%, rgba(96, 165, 250, 0.34) 35%, rgba(59, 130, 246, 0.46) 100%); height: 0; transition: height 0.5s linear; z-index: 0; }
        .floating-action-stack { position: fixed; right: 0.8rem; bottom: 4.2rem; display: flex; flex-direction: column; gap: 0.45rem; z-index: 40; align-items: flex-end; }
        .floating-action-btn { min-height: 2.15rem; padding: 0.48rem 0.82rem; border-radius: 9999px; font-size: 0.82rem; line-height: 1; font-weight: 700; box-shadow: 0 8px 18px rgba(30, 64, 175, 0.14); white-space: nowrap; }
        @media (min-width: 640px) { .floating-action-stack { right: 0.95rem; bottom: 5rem; gap: 0.55rem; } .floating-action-btn { min-height: 2.35rem; padding: 0.58rem 0.95rem; font-size: 0.88rem; } }
        
        /* 运行中状态指示 */
        #page-rixin .bubble.running-indicator { border-color: #60a5fa; box-shadow: inset 1px 1px 4px rgba(255, 255, 255, 0.7), 0 0 15px rgba(59, 130, 246, 0.5); }
        /* 暂停中状态指示 */
        #page-rixin .bubble.paused-indicator { border-color: #f59e0b; box-shadow: inset 1px 1px 4px rgba(255, 255, 255, 0.7), 0 0 15px rgba(245, 158, 11, 0.5); animation-play-state: paused; }

        .bubble-content { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .bubble-cycle-display { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: -0.1em; font-size: clamp(0.7rem, 1.5vw, 1rem); font-weight: bold; color: #1e3a8a; text-shadow: 0 0 2px white; }
        
        #page-rixin .rixin-duration-button { background-color: transparent; color: #0c4a6e; transition: all 0.2s ease; border-radius: 0.5rem; }
        #page-rixin .rixin-duration-button.active { background-color: #3b82f6; color: white; box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4); }
        
        @keyframes rx-float-orb { from { transform: translateY(0px); } to { transform: translateY(-8px); } }
        
        /* --- Page Errors Styles --- */
        #page-errors .student-item.recorded { background-color: #d1fae5; color: #065f46; }
        #page-errors .student-item.selected { background-color: #3b82f6; color: white; font-weight: bold; }
        #page-errors .question-bubble { transition: all 0.2s ease-in-out; border: 2px solid #93c5fd; }
        #page-errors .question-bubble:hover { transform: scale(1.1); background-color: #dbeafe; }
        #page-errors .question-bubble.error { background-color: #ef4444; color: white; border-color: #ef4444; transform: scale(1.05); }
        #page-errors .question-bubble.all-correct { background-color: #22c55e; color: white; border-color: #22c55e; transform: scale(1.05); }
        
        /* --- Page Tasks Styles --- */
        #page-tasks .task-grid-wrapper { width: 100%; overflow-x: auto; max-height: 75vh; }
        #page-tasks .task-grid-container { display: grid; grid-template-columns: min-content repeat(15, 1fr); gap: clamp(0.2rem, 1vw, 0.5rem); padding: 0.5rem; }
        #page-tasks .grid-header, #page-tasks .grid-student-id { display: flex; align-items: center; justify-content: center; font-weight: 600; color: #1e40af; position: sticky; background-color: #f0f9ff; z-index: 1; font-size: clamp(0.8rem, 1.5vw, 1rem); padding: 0 0.5rem; white-space: nowrap; }
        #page-tasks .grid-header { top: 0; z-index: 2; padding-bottom: 0.5rem; border-bottom: 2px solid #e0f2fe; }
        #page-tasks .grid-student-id { left: 0; padding-right: 0.5rem; border-right: 2px solid #e0f2fe; }
        
        /* 液态自适应 Task格子 */
        #page-tasks .score-cell { 
            cursor: pointer; transition: all 0.3s ease; 
            width: clamp(2rem, 4vw, 3.5rem); 
            height: clamp(2rem, 4vw, 3.5rem); 
            border-radius: 9999px; 
            font-size: clamp(0.9rem, 2vw, 1.25rem); 
            font-weight: 700; color: white; display: flex; align-items: center; justify-content: center; margin: auto; transform: scale(0.95); 
        }
        #page-tasks .score-cell:hover { transform: scale(1.05); filter: brightness(1.1); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .score-3 { background-color: #4f46e5; } .score-2 { background-color: #38bdf8; } .score-1 { background-color: #facc15; color: #422006; } .score-0 { background-color: #e5e7eb; color: #4b5563; }
        
        /* --- Page Jigsaw Styles --- */
        #page-jigsaw .mode-button.active { background-color: #4f46e5; color: white; }
        #jigsaw-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 2rem; padding: 1rem; }
        .jigsaw-clover { position: relative; width: 10rem; height: 10rem; margin: auto; }
        .clover-center { position: absolute; width: 4rem; height: 4rem; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #fff; border: 3px solid #93c5fd; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: #1e3a8a; z-index: 10; box-shadow: 0 0 10px rgba(0,0,0,0.1); transition: all 0.4s ease; }
        .clover-center.completed { background: linear-gradient(145deg, #fef08a, #facc15); border-color: #f59e0b; color: #a16207; text-shadow: 0 0 5px rgba(255,255,255,0.5); transform: translate(-50%, -50%) scale(1.1); }
        .petal { position: absolute; width: 3.5rem; height: 3.5rem; border-radius: 50%; top: 50%; left: 50%; margin: -1.75rem; cursor: pointer; transition: all 0.3s ease; }
        .petal:hover { transform: scale(1.1); }
        .petal-red-light { background-color: #fee2e2; } .petal-red-dark { background-color: #dc2626; } .petal-yellow-light { background-color: #fef9c3; } .petal-yellow-dark { background-color: #eab308; } .petal-blue-light { background-color: #dbeafe; } .petal-blue-dark { background-color: #2563eb; } .petal-green-light { background-color: #dcfce7; } .petal-green-dark { background-color: #16a34a; } .petal-purple-light { background-color: #f3e8ff; } .petal-purple-dark { background-color: #9333ea; }
        .clover-3 .p-1 { transform: translateY(-3.2rem); } .clover-3 .p-2 { transform: translateX(-2.8rem) translateY(1.6rem); } .clover-3 .p-3 { transform: translateX(2.8rem) translateY(1.6rem); }
        .clover-4 .p-1 { transform: translateY(-3.2rem); } .clover-4 .p-2 { transform: translateX(-3.2rem); } .clover-4 .p-3 { transform: translateY(3.2rem); } .clover-4 .p-4 { transform: translateX(3.2rem); }
        .clover-5 .p-1 { transform: translateY(-3.5rem); } .clover-5 .p-2 { transform: translateX(-3.3rem) translateY(-1.1rem); } .clover-5 .p-3 { transform: translateX(-2.05rem) translateY(2.8rem); } .clover-5 .p-4 { transform: translateX(2.05rem) translateY(2.8rem); } .clover-5 .p-5 { transform: translateX(3.3rem) translateY(-1.1rem); }

        /* --- Page Heatmap Styles --- */
        #heatmap-lectern { border: 3px solid #60a5fa; background: #e0f2fe; }
        /* 液态自适应 Heatmap座位 */
        .heatmap-seat { 
            width: clamp(2.5rem, 5vw, 4rem); 
            height: clamp(2.5rem, 5vw, 4rem); 
            border-radius: 9999px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; 
            font-size: clamp(1rem, 2.5vw, 1.5rem); 
            font-weight: 700; 
        }
        .heatmap-seat:hover { transform: scale(1.1); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .heat-static-color { background-color: #dbeafe; color: #1e40af; }
        .group-op-button { background-color: #e0f2fe; color: #2563eb; border: 1px solid #93c5fd; }
        .group-total { background-color: #eff6ff; color: #1e3a8a; }

        /* --- Page Lottery Styles --- */
        #page-lottery .lottery-bubble {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.65) 0%, rgba(240, 248, 255, 0.4) 40%, rgba(210, 225, 245, 0.15) 75%, rgba(255, 255, 255, 0.0) 100% );
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 1px 1px 4px rgba(255, 255, 255, 0.7), inset -1px -1px 5px rgba(190, 210, 230, 0.35), 0 0 15px rgba(210, 230, 255, 0.2);
            transition: all 0.3s ease;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #1e3a8a;
            font-size: clamp(1rem, 3vw, 1.5rem); /* 自适应字体 */
        }
        #page-lottery .lottery-bubble.won {
            background: radial-gradient(circle at 30% 30%, #3b82f6 0%, #1d4ed8 100%);
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
            transform: scale(1.15);
            z-index: 10;
            color: white;
            text-shadow: none;
        }
        #page-lottery .lottery-bubble.flashing {
            animation: lottery-flash 0.15s alternate infinite;
            background: #dbeafe;
            border-color: #60a5fa;
        }
        @keyframes lottery-flash {
            from { transform: scale(1); opacity: 0.9; }
            to { transform: scale(1.05); opacity: 1; background: #bfdbfe; }
        }
        .lottery-input {
            @apply w-16 sm:w-20 py-1.5 sm:py-2 px-2 sm:px-3 text-center border-2 border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-500 outline-none text-blue-800 font-bold text-base sm:text-lg bg-white shadow-sm transition-all;
        }
        
        /* --- Score Page Styles --- */
        #page-score .score-panel{
            background: rgba(255,255,255,0.60);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 18px 40px rgba(20, 40, 80, 0.08);
        }
        #page-score .score-input{
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 2px solid rgba(147, 197, 253, 0.85);
            border-radius: 0.75rem;
            background: rgba(255,255,255,0.9);
            color: #1e40af;
            font-weight: 700;
            outline: none;
            transition: all 0.18s ease;
        }
        #page-score .score-input:focus{
            border-color: rgba(59, 130, 246, 0.95);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.18);
        }
        #page-score .score-badge{
            padding: 0.15rem 0.65rem;
            border-radius: 9999px;
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(191, 219, 254, 0.95);
            color: #1e3a8a;
            font-weight: 900;
            box-shadow: 0 10px 24px rgba(20, 40, 80, 0.08);
            font-size: clamp(0.75rem, 1.5vw, 1rem); /* 自适应 */
        }
        #page-score .score-bubble-content{
            display: grid;
            grid-template-columns: 1fr 1.1fr 1fr;
            align-items: center;
            width: 100%;
            height: 100%;
            gap: 0;
        }
        #page-score .score-inner-btn{
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            color: #60a5fa;
            font-weight: 900;
            font-size: clamp(1.2rem, 3vw, 1.8rem); /* 按钮自适应 */
            line-height: 1;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #page-score .score-inner-btn:hover{
            background: rgba(255,255,255,0.28);
        }
        #page-score .score-inner-btn:active{
            transform: scale(0.985);
        }
        #page-score .score-number{
            font-size: clamp(0.9rem, 2.5vw, 1.3rem); /* 编号自适应 */
            font-weight: 900;
            color: #475569;
        }

    </style>
</head>
<!-- 为 body 加入 max-w-full 防止因为内容横向撑破导致的整个页面可左右滑动 -->
<body class="p-2 sm:p-4 md:p-6 pb-24 max-w-full mx-auto">

<div id="main-content-wrapper" class="w-full">
    <!-- 导航栏优化：加入 overflow-x-auto 和 hide-scrollbar 支持手机小屏横向滑动 -->
    <nav class="bg-white/80 backdrop-blur-md shadow-sm rounded-xl p-2 mb-6 w-full max-w-6xl mx-auto sticky top-2 sm:top-4 z-50 flex justify-between items-center gap-2 border border-white/50">
        <div class="flex items-center flex-nowrap flex-1 overflow-x-auto hide-scrollbar gap-1 sm:gap-2 px-1">
            <button class="nav-button whitespace-nowrap text-gray-600 font-bold py-2 px-3 sm:px-4 text-sm sm:text-base shrink-0" data-page="page-rixin">日新阅读</button>
            <button class="nav-button whitespace-nowrap text-gray-600 font-bold py-2 px-3 sm:px-4 text-sm sm:text-base shrink-0" data-page="page-score">积分登记</button>
            <button class="nav-button whitespace-nowrap text-gray-600 font-bold py-2 px-3 sm:px-4 text-sm sm:text-base shrink-0" data-page="page-bubbles">泡泡抢位</button>
            <button class="nav-button whitespace-nowrap text-gray-600 font-bold py-2 px-3 sm:px-4 text-sm sm:text-base shrink-0" data-page="page-lottery">天选之子</button>
            <button class="nav-button whitespace-nowrap text-gray-600 font-bold py-2 px-3 sm:px-4 text-sm sm:text-base shrink-0" data-page="page-errors">错题记录</button>
            <button class="nav-button whitespace-nowrap text-gray-600 font-bold py-2 px-3 sm:px-4 text-sm sm:text-base shrink-0" data-page="page-tasks">任务积分</button>
            <button class="nav-button whitespace-nowrap text-gray-600 font-bold py-2 px-3 sm:px-4 text-sm sm:text-base shrink-0" data-page="page-jigsaw">碎片拼图</button>
            <button class="nav-button whitespace-nowrap text-gray-600 font-bold py-2 px-3 sm:px-4 text-sm sm:text-base shrink-0" data-page="page-heatmap">座位热力图</button>
        </div>
        
        <!-- 全局人数设置控制台 - 保持在最右侧 -->
        <div class="flex items-center shrink-0 border-l-2 border-blue-100 pl-2 sm:pl-3 ml-1 sm:ml-2">
            <span class="text-xs sm:text-sm font-bold text-gray-600 hidden md:inline mr-1.5 whitespace-nowrap">班级人数:</span>
            <input type="number" id="global-student-count" value="60" min="1" max="150" title="调整全班总人数（将同步到所有工具）" class="w-12 sm:w-16 py-1 px-1 text-center border-2 border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none text-blue-800 font-bold bg-white/80 text-sm sm:text-base transition-all">
        </div>
    </nav>

    <div id="app-container" class="w-full">
        <!-- Page 1: 日新阅读 -->
        <div id="page-rixin" class="page-content">
            <header class="text-center py-4 md:py-6">
                <div class="flex justify-center items-center gap-3 sm:gap-4 mb-2"><img src="https://i.postimg.cc/8zGQV1bn/Lion-and-Sprite-with-Transparent-Background.png" alt="[阅读图标]" class="h-16 sm:h-20 md:h-24 filter drop-shadow-lg"><h1 class="title-font main-title text-4xl sm:text-5xl md:text-7xl font-bold">日新阅读</h1></div>
                <p class="text-sm text-gray-500 mb-4 px-2">点击泡泡开始或结束计时，或者使用控制台全局管理</p>
                
                <div class="max-w-3xl mx-auto bg-white/70 backdrop-blur-md rounded-2xl p-3 sm:p-5 mb-6 shadow-sm border border-white flex flex-wrap items-center justify-center gap-3 sm:gap-6">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-gray-700 hidden sm:inline">阅读日期:</span>
                        <input type="date" id="rixin-date" class="py-1.5 px-2 sm:px-3 rounded-lg text-sm border-2 border-blue-200 focus:ring-2 focus:ring-blue-400 outline-none text-blue-800 font-bold bg-white/80 w-32 sm:w-auto">
                    </div>
                    
                    <div class="hidden sm:block w-px h-8 bg-blue-200"></div>
                    
                    <div class="flex items-center gap-1 sm:gap-2">
                        <span class="text-sm font-bold text-gray-700 hidden sm:inline">时长:</span>
                        <div class="flex bg-blue-50 border border-blue-100 p-1 rounded-lg gap-1">
                            <button data-duration="600000" class="rixin-duration-button active py-1 px-2 sm:px-3 text-xs sm:text-sm font-bold whitespace-nowrap">10分</button>
                            <button data-duration="900000" class="rixin-duration-button py-1 px-2 sm:px-3 text-xs sm:text-sm font-bold whitespace-nowrap">15分</button>
                            <button data-duration="1200000" class="rixin-duration-button py-1 px-2 sm:px-3 text-xs sm:text-sm font-bold whitespace-nowrap">20分</button>
                        </div>
                    </div>

                    <div class="hidden md:block w-px h-8 bg-blue-200"></div>

                    <button id="rixin-global-pause-btn" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 sm:px-5 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 min-w-[110px] text-sm sm:text-base">
                        ⏸ 全部暂停
                    </button>
                </div>
            </header>

<script>
    // ============================================
    // --- 全局系统设置与事件分发 ---
    // ============================================
    window.RixinToolbox = {
        studentCount: 60, // 全局默认人数
        onCountChangeHandlers: [], // 订阅者列表：各App可以把刷新自身的函数推入此列表
        exportDirHandle: null,
        exportDirRestorePromise: null
    };

    window.RixinToolbox.openExportDb = function() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open('rixin-toolbox-export-db', 1);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    };

    window.RixinToolbox.persistExportDirHandle = async function(dirHandle) {
        if (!window.indexedDB || !dirHandle) return;
        try {
            const db = await window.RixinToolbox.openExportDb();
            await new Promise((resolve, reject) => {
                const tx = db.transaction('kv', 'readwrite');
                tx.objectStore('kv').put(dirHandle, 'exportDirHandle');
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
            db.close();
        } catch (error) {
            console.warn('导出目录持久化失败（不影响本次导出）:', error);
        }
    };

    window.RixinToolbox.restoreExportDirHandle = function() {
        if (window.RixinToolbox.exportDirHandle) return Promise.resolve(window.RixinToolbox.exportDirHandle);
        if (window.RixinToolbox.exportDirRestorePromise) return window.RixinToolbox.exportDirRestorePromise;
        if (!window.indexedDB) return Promise.resolve(null);

        window.RixinToolbox.exportDirRestorePromise = (async () => {
            try {
                const db = await window.RixinToolbox.openExportDb();
                const handle = await new Promise((resolve, reject) => {
                    const tx = db.transaction('kv', 'readonly');
                    const req = tx.objectStore('kv').get('exportDirHandle');
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
                db.close();

                if (handle && handle.kind === 'directory') {
                    window.RixinToolbox.exportDirHandle = handle;
                    return handle;
                }
            } catch (error) {
                console.warn('读取历史导出目录失败，将改为手动选择。', error);
            }
            return null;
        })().finally(() => {
            window.RixinToolbox.exportDirRestorePromise = null;
        });

        return window.RixinToolbox.exportDirRestorePromise;
    };

    window.RixinToolbox.ensureWritableExportDirHandle = async function() {
        let dirHandle = window.RixinToolbox.exportDirHandle || await window.RixinToolbox.restoreExportDirHandle();

        if (dirHandle) {
            try {
                if (typeof dirHandle.queryPermission === 'function') {
                    let permission = await dirHandle.queryPermission({ mode: 'readwrite' });
                    if (permission !== 'granted') {
                        permission = await dirHandle.requestPermission({ mode: 'readwrite' });
                    }
                    if (permission !== 'granted') {
                        dirHandle = null;
                        window.RixinToolbox.exportDirHandle = null;
                    }
                }
            } catch (error) {
                console.warn('历史目录权限失效，将重新选择目录。', error);
                dirHandle = null;
                window.RixinToolbox.exportDirHandle = null;
            }
        }

        if (!dirHandle) {
            alert('请先选择当前 HTML 所在文件夹。首次设置后，后续打开网页会自动尝试沿用该目录。');
            dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            window.RixinToolbox.exportDirHandle = dirHandle;
            await window.RixinToolbox.persistExportDirHandle(dirHandle);
        }

        return dirHandle;
    };

    window.RixinToolbox.getPickerTypesByFilename = function(filename) {
        const lowerName = String(filename || '').toLowerCase();
        if (lowerName.endsWith('.xlsx')) {
            return [{
                description: 'Excel 工作簿',
                accept: {
                    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx']
                }
            }];
        }
        if (lowerName.endsWith('.csv')) {
            return [{
                description: 'CSV 文件',
                accept: {
                    'text/csv': ['.csv']
                }
            }];
        }
        if (lowerName.endsWith('.txt')) {
            return [{
                description: '文本文件',
                accept: {
                    'text/plain': ['.txt']
                }
            }];
        }
        return [];
    };

    window.RixinToolbox.downloadBlobDirectly = function(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    window.RixinToolbox.saveBlob = function(blob, filename) {
        const fallbackDownload = () => window.RixinToolbox.downloadBlobDirectly(blob, filename);
        const pickerTypes = window.RixinToolbox.getPickerTypesByFilename(filename);

        (async () => {
            if (typeof window.showSaveFilePicker === 'function') {
                const fileHandle = await window.showSaveFilePicker({
                    suggestedName: filename,
                    types: pickerTypes,
                    excludeAcceptAllOption: false
                });
                const writable = await fileHandle.createWritable();
                await writable.write(blob);
                await writable.close();
                return;
            }

            if (typeof window.showDirectoryPicker === 'function') {
                const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(await blob.arrayBuffer());
                await writable.close();
                return;
            }

            fallbackDownload();
        })().catch((error) => {
            if (error && error.name === 'AbortError') return;
            console.warn('询问导出位置失败，已回退为浏览器下载。', error);
            fallbackDownload();
        });
    };

    window.RixinToolbox.saveTextFile = function(text, filename, mimeType = 'text/plain;charset=utf-8') {
        const content = text.startsWith('\ufeff') ? text : `\ufeff${text}`;
        const blob = new Blob([content], { type: mimeType });
        window.RixinToolbox.saveBlob(blob, filename);
    };

    window.RixinToolbox.saveWorkbook = function(workbook, filename) {
        const workbookData = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([workbookData], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        });
        window.RixinToolbox.saveBlob(blob, filename);
    };

    document.addEventListener('DOMContentLoaded', () => {

            window.RixinToolbox.studentCount = val;
            window.RixinToolbox.onCountChangeHandlers.forEach(handler => handler(val));
        });
    }
});

        function refreshAllDisplays() {
            timers.forEach(timer => {
                const currentElapsed = timer.isRunning ? (Date.now() - timer.startTime) : timer.elapsed;
                const cycleCount = Math.floor(currentElapsed / cycleDurationMs);
                const elapsedInCycle = currentElapsed % cycleDurationMs;

        function updateTimerDisplay(timer) { 
            if (timer.isRunning) { 
                timer.elapsed = Date.now() - timer.startTime; 
                const cycleCount = Math.floor(timer.elapsed / cycleDurationMs); 
                const elapsedInCycle = timer.elapsed % cycleDurationMs; 
                timer.fillElement.style.height = `${(elapsedInCycle / cycleDurationMs) * 100}%`; 
                timer.cycleElement.textContent = cycleCount > 0 ? `+${cycleCount}` : ''; 
                timer.timeElement.textContent = formatTime(timer.elapsed); 
                timer.intervalId = requestAnimationFrame(() => updateTimerDisplay(timer)); 
            } 
        }

        function handleTimerToggle(timer) { 
            if (rxGlobalPaused) {
                if (timer.isPausedByGlobal) {
                    timer.isPausedByGlobal = false;
                    timer.element.classList.remove('paused-indicator');
                } else {
                    timer.isPausedByGlobal = true;
                    timer.elapsed = 0;
                    timer.element.classList.add('paused-indicator');
                    timer.fillElement.style.height = '0%';
                    timer.timeElement.textContent = formatTime(0);
                }
                return; 
            }

            timer.isRunning = !timer.isRunning; 
            if (timer.isRunning) { 
                timer.element.classList.add('running-indicator'); 
                timer.startTime = Date.now() - timer.elapsed; 
                updateTimerDisplay(timer); 
            } else { 
                timer.element.classList.remove('running-indicator');

                            t.isRunning = false;
                            t.isPausedByGlobal = true;
                            t.elapsed = Date.now() - t.startTime;

                bubbleEl.addEventListener('click', () => handleTimerToggle(timer));

            fileInput.value = '';

            fileInput.onchange = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                if (typeof XLSX === 'undefined') return alert('Excel组件未加载。');
                try {
                    const allData = [];
                    for (const file of files) {
                        const data = await readExcelFile(file);
                        allData.push(...data);
                    }
                    if (allData.length === 0) return alert('未找到有效数据。');
                    const studentStats = {};
                    allData.forEach(row => {
                        const values = Object.values(row);
                        if (values.length < 2) return;
                        const studentId = values[0];
                        const minutes = parseInt(values[1]) || 0;
                        const keys = Object.keys(row);
                        const dateName = keys[1];
                        if (!studentStats[studentId]) {
                            studentStats[studentId] = { '学号': studentId, '总阅读时长': 0, '阅读记录': {} };
                        }
                        studentStats[studentId]['总阅读时长'] += minutes;
                        studentStats[studentId]['阅读记录'][dateName] = minutes;
                    });
                    const allDates = new Set();
                    Object.values(studentStats).forEach(student => { Object.keys(student['阅读记录']).forEach(date => { allDates.add(date); }); });
                    const sortedDates = Array.from(allDates).sort();
                    const studentsArray = Object.values(studentStats);
                    studentsArray.sort((a, b) => b['总阅读时长'] - a['总阅读时长']);
                    studentsArray.forEach((student, index) => { student['排名'] = index + 1; });
                    const rows = [['学号', ...sortedDates, '总阅读时长', '排名']];
                    studentsArray.forEach(student => {

                        sortedDates.forEach(date => { row.push(student['阅读记录'][date] || 0); });
                        row.push(student['总阅读时长']);
                        row.push(student['排名']);

                } catch (error) { alert('合并统计失败：' + error.message); }
            };
        });
        
        function readExcelFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        resolve(XLSX.utils.sheet_to_json(firstSheet));
                    } catch (error) { reject(error); }
                };
                reader.onerror = () => reject(new Error('文件读取失败'));
                reader.readAsArrayBuffer(file);
            });
        }

    (function() {
        const container = document.getElementById('page-bubbles'); if (!container) return;
        let allBubblesData = [], selectedBubbleIdsInOrder = [], gameActive = false, animationFrameId = null;
        
        let isGamePaused = false;
        let gamePauseStartTime = 0;

        const bubblesContainer = container.querySelector('#bubbles-bubbles-container'), 
              startBtn = container.querySelector('#bubbles-start-btn'), 
              pauseBtn = container.querySelector('#bubbles-pause-btn'), 
              resetBtn = container.querySelector('#bubbles-reset-btn'), 
              exportBtn = container.querySelector('#bubbles-export-btn');

        function formatTime(ms) { const s = Math.floor(ms / 1000); return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
        const numberToChineseOrdinal = (num) => { const N = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"]; if (num <= 10) return `第${N[num]}`; if (num < 20) return `第十${N[num % 10] || ''}`; const ten = Math.floor(num/10), one = num % 10; return `第${N[ten]}十${one > 0 ? N[one] : ''}`; };
        
        function renderBubbles() { 
            if(!bubblesContainer) return; 
            bubblesContainer.innerHTML = ''; 
            allBubblesData.forEach(bubbleObj => { 
                let el = bubbleObj.element; 
                if (!el) { 
                    el = document.createElement('div'); 
                    el.className = 'bubble aspect-square w-full h-full rounded-full cursor-pointer flex flex-col items-center justify-center text-center p-0.5 transition-all max-w-[6.5rem] max-h-[6.5rem]'; 
                    el.dataset.id = bubbleObj.id; 
                    el.addEventListener('click', () => onBubbleClick(bubbleObj)); 
                    bubbleObj.element = el; 
                } else { 
                    el.innerHTML = ''; 
                } 
                
                if (isGamePaused && bubbleObj.isRunning && !bubbleObj.selected) {
                    el.style.animationPlayState = 'paused';
                    el.style.borderColor = '#f59e0b';
                    el.style.boxShadow = 'inset 1px 1px 4px rgba(255, 255, 255, 0.7), 0 0 15px rgba(245, 158, 11, 0.4)';
                } else {
                    el.style.animationPlayState = 'running';
                    el.style.borderColor = '';
                    el.style.boxShadow = '';
                }

                const numberEl = document.createElement('div'); 
                numberEl.className = 'bubble-number text-lg sm:text-xl md:text-2xl font-bold'; 
                numberEl.textContent = bubbleObj.id; 
                const timeEl = document.createElement('span'); 
                timeEl.className = 'bubble-time block text-[0.65rem] sm:text-xs md:text-sm font-medium mt-0.5 md:mt-1'; 
                if (bubbleObj.selected) { 
                    const timeText = formatTime(bubbleObj.elapsed); 
                    timeEl.innerHTML = `${numberToChineseOrdinal(bubbleObj.selectionOrder)}<br>(${timeText})`; 
                } else { 
                    timeEl.textContent = gameActive ? (isGamePaused ? '已暂停' : '计时中') : '未开始'; 
                } 
                el.append(numberEl, timeEl); 
                el.classList.toggle('selected', bubbleObj.selected); 
                bubblesContainer.appendChild(bubbleObj.element); 
            }); 
        }

        function onBubbleClick(bubbleObj) { 
            if (!gameActive) return; 
            
            bubbleObj.selected = !bubbleObj.selected; 
            if (bubbleObj.selected) { 
                bubbleObj.isRunning = false; 
                if (isGamePaused) {
                    bubbleObj.elapsed = gamePauseStartTime - bubbleObj.startTime;
                } else {
                    bubbleObj.elapsed = Date.now() - bubbleObj.startTime; 
                }
                selectedBubbleIdsInOrder.push(bubbleObj.id); 
            } else { 
                const index = selectedBubbleIdsInOrder.indexOf(bubbleObj.id); 
                if(index > -1) selectedBubbleIdsInOrder.splice(index, 1); 
                bubbleObj.isRunning = true; 
                if (isGamePaused) {
                    bubbleObj.startTime = gamePauseStartTime - bubbleObj.elapsed;
                } else {
                    bubbleObj.startTime = Date.now() - bubbleObj.elapsed; 
                }
            } 
            selectedBubbleIdsInOrder.sort((a,b) => { 
                const bubbleA = allBubblesData.find(bub => bub.id === a), bubbleB = allBubblesData.find(bub => bub.id === b); 
                return bubbleA.elapsed - bubbleB.elapsed; 
            }); 
            selectedBubbleIdsInOrder.forEach((id, idx) => { 
                const bubble = allBubblesData.find(b => b.id === id); 
                if (bubble) bubble.selectionOrder = idx + 1; 
            }); 
            allBubblesData.forEach(bubble => { 
                if (!selectedBubbleIdsInOrder.includes(bubble.id)) bubble.selectionOrder = null; 
            }); 
            renderBubbles(); 
        }

        function updateTimersLoop() { 
            if(!gameActive || isGamePaused) return; 
            allBubblesData.forEach(bubble => { 
                if (bubble.isRunning && !bubble.selected) { 
                    const elapsed = Date.now() - bubble.startTime;
                    const timeText = formatTime(elapsed);
                    const timeEl = bubble.element.querySelector('.bubble-time'); 
                    if (timeEl) timeEl.textContent = timeText;

                if (isGamePaused) {
                    isGamePaused = false;
                    pauseBtn.innerHTML = '⏸ 全部暂停';
                    pauseBtn.className = pauseBtn.className.replace('bg-green-500', 'bg-orange-500').replace('hover:bg-green-600', 'hover:bg-orange-600');
                    const pauseDuration = Date.now() - gamePauseStartTime;
                    allBubblesData.forEach(b => {
                        if (b.isRunning && !b.selected) {
                            b.startTime += pauseDuration;
                        }
                    });
                    renderBubbles(); 
                    updateTimersLoop();
                } else {
                    isGamePaused = true;
                    gamePauseStartTime = Date.now();
                    pauseBtn.innerHTML = '▶ 继续计时';
                    pauseBtn.className = pauseBtn.className.replace('bg-orange-500', 'bg-green-500').replace('hover:bg-orange-600', 'hover:bg-green-600');
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    renderBubbles(); 
                }
            });
        }

        function initBubbles() { 
            if(animationFrameId) cancelAnimationFrame(animationFrameId); 
            animationFrameId = null; 
            isGamePaused = false;
            gameActive = false; 

            const currentTotalCount = window.RixinToolbox.studentCount; 
            allBubblesData = []; 
            for (let i = 1; i <= currentTotalCount; i++) {
                allBubblesData.push({ id: i, selected: false, elapsed: 0, startTime: 0, selectionOrder: null, isRunning: false, element: null }); 
            }
            selectedBubbleIdsInOrder = []; 
            
            if(startBtn) { 
                startBtn.disabled = false; 
                startBtn.innerHTML = '▶ 开始全部计时'; 
            } 
            if(pauseBtn) {
                pauseBtn.disabled = true;
                pauseBtn.innerHTML = '⏸ 全部暂停';
                pauseBtn.className = pauseBtn.className.replace('bg-green-500', 'bg-orange-500').replace('hover:bg-green-600', 'hover:bg-orange-600');
            }

            renderBubbles(); 
        }
        
        window.RixinToolbox.onCountChangeHandlers.push(initBubbles);

        if(startBtn) startBtn.addEventListener('click', () => { 
            if (gameActive) return; 
            gameActive = true; 
            startBtn.disabled = true; 
            startBtn.innerHTML = '计时中...'; 
            if(pauseBtn) pauseBtn.disabled = false; 

            allBubblesData.forEach(b => { 
                if(!b.selected) { 
                    b.isRunning = true; 
                    b.startTime = Date.now(); 
                } 
            }); 
            renderBubbles(); 
            updateTimersLoop(); 
        });

        if(resetBtn) resetBtn.addEventListener('click', initBubbles);

        if(exportBtn) exportBtn.addEventListener('click', () => { 
            const data = allBubblesData.map(b => { 
                let currentElapsed = b.elapsed;

                    if (isGamePaused) {
                        currentElapsed = gamePauseStartTime - b.startTime;
                    } else {
                        currentElapsed = Date.now() - b.startTime;
                    }
                }
                return { 
                    "号数": b.id, 
                    "状态": b.selected ? `${numberToChineseOrdinal(b.selectionOrder)} 完成` : "未完成", 
                    "用时": b.selected ? formatTime(b.elapsed) : formatTime(currentElapsed) 
                }; 
            }).sort((a,b) => { 
                const aData = allBubblesData.find(d => d.id === a.号数), bData = allBubblesData.find(d => d.id === b.号数); 
                if(aData.selected && !bData.selected) return -1; 
                if(!aData.selected && bData.selected) return 1; 
                if(aData.selected && bData.selected) return aData.selectionOrder - bData.selectionOrder; 
                return aData.id - bData.id; 
            }); 
            const ws = XLSX.utils.json_to_sheet(data); 
            const wb = XLSX.utils.book_new(); 
            XLSX.utils.book_append_sheet(wb, ws, "抢位记录"); 
            window.RixinToolbox.saveWorkbook(wb, `泡泡抢位记录_${new Date().toISOString().slice(0,10)}.xlsx`);

            grid.innerHTML = '';

            for(let i=1; i<=totalStudents; i++) {
                const bubble = document.createElement('div');
                const isWon = winners.has(i);
                bubble.className = `lottery-bubble max-w-[6.5rem] max-h-[6.5rem] ${isWon ? 'won' : ''}`;
                bubble.textContent = i;
                bubble.id = `lottery-b-${i}`;
                bubble.style.animation = `rx-float-orb 8s ease-in-out ${-Math.random()*5}s infinite alternate`;

            winnerCountEl.textContent = winners.size;
            poolCountEl.textContent = totalStudents - winners.size;
            if(winners.size >= totalStudents) {
                startBtn.disabled = true;
                startBtn.textContent = "全部抽完";
            } else {
                startBtn.disabled = false;
                startBtn.textContent = `开始抽奖`;
            }

        window.RixinToolbox.onCountChangeHandlers.push((count) => {
            totalInput.value = count;
            winners.clear();

        });

        drawInput.addEventListener('change', () => {
            drawCount = parseInt(drawInput.value) || 1;
            if(drawCount < 1) drawCount = 1;
        });

                winners.clear();

            }

        startBtn.addEventListener('click', async () => {
            drawCount = parseInt(drawInput.value) || 1;
            const available = [];
            for(let i=1; i<=totalStudents; i++) {
                if(!winners.has(i)) available.push(i);
            }

            if(available.length === 0) return alert("无人可抽！");

            startBtn.disabled = true;
            startBtn.textContent = "🎲 抽奖中...";
            
            const bubbles = document.querySelectorAll('#page-lottery .lottery-bubble:not(.won)');
            bubbles.forEach(b => b.classList.add('flashing'));

            await new Promise(r => setTimeout(r, 1500));
            bubbles.forEach(b => b.classList.remove('flashing'));

            const count = Math.min(drawCount, available.length);
            const roundWinners = [];
            for (let i = available.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [available[i], available[j]] = [available[j], available[i]];
            }
            for(let i=0; i<count; i++) {
                roundWinners.push(available[i]);
                winners.add(available[i]);
            }

            roundWinners.forEach(id => {
                const el = document.getElementById(`lottery-b-${id}`);
                if(el) {
                    el.classList.add('won');
                    el.animate([
                        { transform: 'scale(1)' },
                        { transform: 'scale(1.3)' },
                        { transform: 'scale(1.15)' }
                    ], { duration: 400, fill: 'forwards' });
                }
            });

            updateStats();
        });

        totalInput.value = totalStudents;
        renderGrid();
    })();

            classTotalScore += (heatmapData['seat-sp-1'] ?? 0);
            classTotalScore += (heatmapData['seat-sp-2'] ?? 0);

            const classTotalRow = Array(totalCols).fill(null);
            classTotalRow[0] = '全班总分:';
            classTotalRow[1] = classTotalScore;
            layoutData.push(classTotalRow);

            const layoutWorksheet = XLSX.utils.aoa_to_sheet(layoutData);
            const merges = [{ s: { r: 0, c: 3 }, e: { r: 0, c: 7 } }];
            const totalsRowIndex = ROWS_PER_GROUP + 4;
             for (let g = 0; g < NUM_GROUPS; g++) {
                merges.push({ s: { r: totalsRowIndex, c: g * 3 }, e: { r: totalsRowIndex, c: g * 3 } }); 
            }
            layoutWorksheet['!merges'] = merges;
            layoutWorksheet['!cols'] = [ {wch:10}, {wch:10}, {wch:5}, {wch:10}, {wch:10}, {wch:5}, {wch:10}, {wch:10}, {wch:5}, {wch:10}, {wch:10} ];

            const logData = [];
            logData.push(['座位位置', '操作', '操作后分数', '时间']);
            heatmapLog.forEach(log => {
                logData.push([
                    getSeatName(log.seatId),
                    log.change,
                    log.scoreAfter,
                    formatTimestamp(log.timestamp)
                ]);
            });
            const logWorksheet = XLSX.utils.aoa_to_sheet(logData);
            logWorksheet['!cols'] = [ {wch:20}, {wch:10}, {wch:15}, {wch:25} ];

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, layoutWorksheet, "座位热力图");
            XLSX.utils.book_append_sheet(workbook, logWorksheet, "详细操作日志");
            window.RixinToolbox.saveWorkbook(workbook, `座位热力图记录_${new Date().toISOString().slice(0,10)}.xlsx`);
        });

        if(modeToggleBtn) modeToggleBtn.addEventListener('click', toggleMode);
        renderLayout();
    })();
    
    // --- App X: 积分登记 ---
    (function () {
        const container = document.getElementById('page-score');
        if (!container) return;

        const dateInput = container.querySelector('#score-date');
        const taskInput = container.querySelector('#score-task');
        const defaultValueEl = container.querySelector('#score-default-value');
        const defaultMinusBtn = container.querySelector('#score-default-minus');
        const defaultPlusBtn = container.querySelector('#score-default-plus');
        const bubblesContainer = container.querySelector('#score-bubbles-container');
        const exportBtn = container.querySelector('#score-export-btn');

        let defaultScore = 3;
        let scores = Array.from({ length: window.RixinToolbox.studentCount }, () => defaultScore);

        window.RixinToolbox.onCountChangeHandlers.push((newCount) => {
            if (scores.length < newCount) {
                scores.push(...Array.from({ length: newCount - scores.length }, () => defaultScore));
            } else if (scores.length > newCount) {
                scores.length = newCount;
            }
            renderBubbles();
        });

        function getLocalDateYYYYMMDD(d = new Date()) { const y = d.getFullYear(); const m = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0'); return `${y}-${m}-${day}`; }
        function sanitizeTaskName(name) { return String(name || '').trim().replace(/[\/\\:\*\?"<>\|]/g, '').replace(/\s+/g, ' ').trim(); }
        function updateDefaultScoreDisplay() { if (defaultValueEl) defaultValueEl.textContent = String(defaultScore); }

        function resetAllScoresToDefault() {
            const count = window.RixinToolbox.studentCount;
            scores = Array.from({ length: count }, () => defaultScore);
            for (let i = 1; i <= count; i++) {
                const label = document.getElementById(`score-label-${i}`);
                if (label) label.textContent = String(defaultScore);
            }
        }

        function updateStudentScoreLabel(studentId) {
            const label = document.getElementById(`score-label-${studentId}`);
            if (label) label.textContent = String(scores[studentId - 1]);
        }

        function renderBubbles() {
            if (!bubblesContainer) return;
            bubblesContainer.innerHTML = '';
            
            const count = window.RixinToolbox.studentCount;

            for (let i = 1; i <= count; i++) {
                const cell = document.createElement('div');
                // 确保容器不被网格拉伸
                cell.className = 'flex flex-col items-center select-none w-full max-w-[5.4rem]'; 

                const scoreBadge = document.createElement('div');
                scoreBadge.id = `score-label-${i}`;
                scoreBadge.className = 'score-badge mb-1 sm:mb-2';
                scoreBadge.textContent = String(scores[i - 1]);

                // 强制正方形与完美裁切，去掉外层 wrap 杜绝拉伸隐患
                const bubbleEl = document.createElement('div');
                bubbleEl.className = 'bubble relative w-full aspect-square rounded-full overflow-hidden shadow-inner flex flex-col';

                const fillEl = document.createElement('div');
                fillEl.className = 'bubble-fill-effect';
                fillEl.style.height = '0%';

                // 内部容器也增加 rounded-full overflow-hidden 完美裁剪按钮的方形高亮边缘
                const contentEl = document.createElement('div');
                contentEl.className = 'bubble-content score-bubble-content rounded-full overflow-hidden w-full h-full';

                const minusBtn = document.createElement('button');
                minusBtn.type = 'button';
                minusBtn.dataset.action = 'minus';
                minusBtn.dataset.id = String(i);
                minusBtn.className = 'score-inner-btn';
                minusBtn.textContent = '-';
                minusBtn.setAttribute('aria-label', `学生${i}减分`);

                const numberEl = document.createElement('div');
                numberEl.className = 'bubble-number score-number';
                numberEl.textContent = String(i);

                const plusBtn = document.createElement('button');
                plusBtn.type = 'button';
                plusBtn.dataset.action = 'plus';
                plusBtn.dataset.id = String(i);
                plusBtn.className = 'score-inner-btn';
                plusBtn.textContent = '+';
                plusBtn.setAttribute('aria-label', `学生${i}加分`);

                contentEl.append(minusBtn, numberEl, plusBtn);
                bubbleEl.append(fillEl, contentEl);
                cell.append(scoreBadge, bubbleEl);
                bubblesContainer.appendChild(cell);
            }
        }

        function changeDefaultScore(delta) {
            defaultScore += delta;
            updateDefaultScoreDisplay();
            resetAllScoresToDefault();
        }

        function handleBubbleAreaClick(e) {
            const btn = e.target.closest('button[data-action][data-id]');
            if (!btn) return;
            const id = parseInt(btn.dataset.id, 10);
            if (!id || id < 1 || id > window.RixinToolbox.studentCount) return;
            const action = btn.dataset.action;
            if (action === 'minus') scores[id - 1] = scores[id - 1] - 1;
            if (action === 'plus') scores[id - 1] = scores[id - 1] + 1;
            updateStudentScoreLabel(id);
        }

        function exportToExcel() {
            const dateStr = (dateInput?.value || '').trim();
            const rawTask = (taskInput?.value || '').trim();
            if (!dateStr || !rawTask) return alert('请先填写「日期」和「任务」后再导出。');
            const taskName = sanitizeTaskName(rawTask);
            if (!taskName) return alert('任务名称只包含非法字符，请重新输入。');
            if (typeof XLSX === 'undefined') return alert('导出组件 XLSX 未加载成功。请检查网络或刷新后重试。');

            const headerName = `${dateStr}${taskName}`;
            const rows = [[headerName, '学号', '分数']];
            const count = window.RixinToolbox.studentCount;
            for (let i = 1; i <= count; i++) {
                rows.push([headerName, i, scores[i - 1]]);
            }

            const ws = XLSX.utils.aoa_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'records');
            window.RixinToolbox.saveWorkbook(wb, `${headerName}.xlsx`);
        }

        async function mergeHistoricalScores() {
            const fileInput = document.getElementById('score-file-input');
            if (!fileInput) {
                alert('文件选择器未找到，请刷新页面重试。');
                return;
            }

            fileInput.value = '';
            fileInput.click();

            fileInput.onchange = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                if (typeof XLSX === 'undefined') {
                    alert('Excel组件未加载，请检查网络连接。');
                    return;
                }

                try {
                    const allData = [];

                    for (const file of files) {
                        const data = await readExcelFile(file);
                        allData.push(...data);
                    }

                    if (allData.length === 0) {
                        alert('未找到有效数据，请检查Excel文件格式。');
                        return;
                    }

                    const studentStats = {};

                    allData.forEach(row => {
                        const values = Object.values(row); 
                        if (values.length < 3) return; 

                        const taskName = values[0];
                        const studentId = values[1]; 
                        const score = parseInt(values[2]) || 0; 

                        if (!studentStats[studentId]) {
                            studentStats[studentId] = {
                                '学号': studentId,
                                '总分': 0,
                                '任务记录': {}
                            };
                        }

                        studentStats[studentId]['总分'] += score;
                        studentStats[studentId]['任务记录'][taskName] = score;
                    });

                    const allTasks = new Set();
                    Object.values(studentStats).forEach(student => {
                        Object.keys(student['任务记录']).forEach(task => {
                            allTasks.add(task);
                        });
                    });
                    const sortedTasks = Array.from(allTasks).sort();

                    const studentsArray = Object.values(studentStats);
                    studentsArray.sort((a, b) => b['总分'] - a['总分']);

                    studentsArray.forEach((student, index) => {
                        student['排名'] = index + 1;
                    });

                    const rows = [['学号', ...sortedTasks, '总分', '排名']];

                    studentsArray.forEach(student => {
                        const row = [student['学号']];
                        sortedTasks.forEach(task => {
                            row.push(student['任务记录'][task] || 0);
                        });
                        row.push(student['总分']);
                        row.push(student['排名']);
                        rows.push(row);
                    });

                    const ws = XLSX.utils.aoa_to_sheet(rows);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, '积分统计');

                    const filename = `学生积分统计汇总_${new Date().toISOString().slice(0, 10)}.xlsx`;
                    window.RixinToolbox.saveWorkbook(wb, filename);

                    alert(`成功！已合并 ${files.length} 个文件，统计 ${studentsArray.length} 名学生。`);

                } catch (error) {
                    console.error('合并统计失败:', error);
                    alert('合并统计失败：' + error.message);
                }
            };
        }

        function readExcelFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });

                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                        resolve(jsonData);
                    } catch (error) {
                        reject(error);
                    }
                };

                reader.onerror = () => reject(new Error('文件读取失败'));
                reader.readAsArrayBuffer(file);
            });
        }

        function init() {
            if (dateInput) dateInput.value = getLocalDateYYYYMMDD(new Date());
            updateDefaultScoreDisplay();
            renderBubbles();

            defaultMinusBtn?.addEventListener('click', () => changeDefaultScore(-1));
            defaultPlusBtn?.addEventListener('click', () => changeDefaultScore(1));
            bubblesContainer?.addEventListener('click', handleBubbleAreaClick);
            exportBtn?.addEventListener('click', exportToExcel);

            const mergeBtn = document.getElementById('score-merge-btn');
            if (mergeBtn) {
                mergeBtn.addEventListener('click', mergeHistoricalScores);
            }
        }

        init();
    })();

</script>
